# [INPUT]: 依赖 Rime 的 moran_ja_hybrid 方案在 Android 端运行，依赖 Fcitx5-Android UI 渲染器
# [OUTPUT]: 对外提供 Fcitx5 Wabi-Sabi Warm Wood 键盘主题配置
# [POS]: skins_and_layouts/fcitx5 的核心主题文件，为用户提供京都温润木质感视觉外观
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

[Metadata]
Name=Moran Hybrid Warm Wood
Author=Antigravity
Version=1.0
ScaleWithDpi=True

[Theme]
# 键盘主面板背景色 (深胡桃木色)
BackGroundColor=#2A1E17

# 普通字符按键样式 (燕麦和纸白键帽，炭黑字)
KeyColor=#F4F1EA
KeyTextColor=#3A322D
KeyShadowColor=#1F1510

# 动作/修饰键样式 (暖沙灰)
ActionKeyColor=#E4DEC9
ActionKeyTextColor=#3A322D
ActionKeyShadowColor=#1F1510

# 核心 "日本 (🇯🇵)" 引导键/高亮选词样式 (朱砂漆红)
HighlightKeyColor=#D94E34
HighlightKeyTextColor=#FFFFFF

# 候选词栏样式 (古朴茶室木格)
CandidateBackgroundColor=#2A1E17
CandidateTextColor=#E4DEC9
HighlightCandidateBackgroundColor=#D94E34
HighlightCandidateTextColor=#FFFFFF

# 字体与微调
Font=Sans 14
CandidateFont=Sans 16
