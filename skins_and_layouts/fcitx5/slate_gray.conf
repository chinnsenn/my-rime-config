# [INPUT]: 依赖 Rime 的 moran_ja_hybrid 方案在 Android 端运行，依赖 Fcitx5-Android UI 渲染器
# [OUTPUT]: 对外提供 Fcitx5 Slate Gray 键盘主题配色配置
# [POS]: skins_and_layouts/fcitx5 的核心主题文件，为用户提供科技冷灰感视觉外观
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

[Metadata]
Name=Moran Hybrid Slate Gray
Author=Antigravity
Version=1.0
ScaleWithDpi=True

[Theme]
# 键盘主面板背景色 (曜石玄黑)
BackGroundColor=#121214

# 普通字符按键样式 (阳极氧化铝灰键帽，白字)
KeyColor=#1E1E22
KeyTextColor=#E0E0E0
KeyShadowColor=#0B0B0C

# 动作/修饰键样式 (Shift, Return, Tab, Backspace)
ActionKeyColor=#2A2A2E
ActionKeyTextColor=#FFFFFF
ActionKeyShadowColor=#0B0B0C

# 核心分号 ";" 键/激活态样式 (科技蓝)
HighlightKeyColor=#3B82F6
HighlightKeyTextColor=#FFFFFF

# 状态指示灯 (翠绿色，提示中英文/模式切换)
IndicatorColor=#10B981

# 候选词栏样式 (中置视野)
CandidateBackgroundColor=#121214
CandidateTextColor=#C8C8CC
HighlightCandidateBackgroundColor=#3B82F6
HighlightCandidateTextColor=#FFFFFF

# 字体与微调
Font=Sans 14
CandidateFont=Sans 16
