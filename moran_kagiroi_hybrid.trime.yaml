# Rime schema
# encoding: utf-8
# ===================================================================
# [INPUT]: 依赖同文输入法（Trime）的主题与虚拟键盘解析器，以及
#          moran_kagiroi_hybrid.schema.yaml 的分号 Kagiroi 前缀规则。
# [OUTPUT]: 提供竖横屏 QWERTY、数字层及 iOS 式完整分类符号层；「日」键
#           实际输入分号，直接开启 Kagiroi 罗马字日文段。
# [POS]:   Rime 用户目录根部的独立 Trime 主题与键盘布局。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ===================================================================

config_version: "1.0"
name: "魔然·篝火日混"
author: "Codex"

# 保留同文内置的功能键与配色，避免覆盖用户已安装主题的基础能力。
android_keys:
  __include: trime:/android_keys
preset_keys:
  __include: trime:/preset_keys
  Keyboard_moran_kagiroi_symbols:
    label: "符"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_ios
  Keyboard_moran_kagiroi_hybrid:
    label: "ABC"
    send: Eisu_toggle
    select: moran_kagiroi_hybrid
  Keyboard_moran_kagiroi_numbers:
    label: "123"
    send: Eisu_toggle
    select: moran_kagiroi_numbers
  Keyboard_moran_kagiroi_symbol_catalog:
    label: "目录"
    send: Eisu_toggle
    select: moran_kagiroi_symbol_catalog
  Keyboard_moran_kagiroi_symbols_english:
    label: "英文"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_english_ios
  Keyboard_moran_kagiroi_symbols_chinese:
    label: "中文"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_chinese_ios
  Keyboard_moran_kagiroi_symbols_japanese:
    label: "日文"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_japanese_ios
  Keyboard_moran_kagiroi_symbols_math:
    label: "数学"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_math_ios
  Keyboard_moran_kagiroi_symbols_special:
    label: "特殊"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_special_ios
  Keyboard_moran_kagiroi_symbols_units:
    label: "单位"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_units_ios
  Keyboard_moran_kagiroi_symbols_list:
    label: "列表"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_list_ios
  Keyboard_moran_kagiroi_symbols_pinyin:
    label: "拼音"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_pinyin_ios
  Keyboard_moran_kagiroi_symbols_bopomofo:
    label: "注音"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_bopomofo_ios
  Keyboard_moran_kagiroi_symbols_radicals:
    label: "部首"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_radicals_ios
  Keyboard_moran_kagiroi_symbols_greek:
    label: "希腊"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_greek_ios
  Keyboard_moran_kagiroi_symbols_cyrillic:
    label: "俄文"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_cyrillic_ios
  Keyboard_moran_kagiroi_symbols_latin:
    label: "拉丁"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_latin_ios
  Keyboard_moran_kagiroi_symbols_korean:
    label: "韩文"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_korean_ios
  Keyboard_moran_kagiroi_symbols_ipa:
    label: "音标"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_ipa_ios
  Keyboard_moran_kagiroi_symbols_hiragana:
    label: "平假"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_hiragana_ios
  Keyboard_moran_kagiroi_symbols_katakana:
    label: "片假"
    send: Eisu_toggle
    select: moran_kagiroi_symbols_katakana_ios
fallback_colors:
  __include: trime:/fallback_colors
preset_color_schemes:
  __include: trime:/preset_color_schemes

style:
  # 所有会从本布局切换到的键盘必须在此声明。
  keyboards:
    - .default
    - moran_kagiroi_hybrid
    - moran_kagiroi_hybrid_landscape
    - moran_kagiroi_numbers
    - moran_kagiroi_symbols_ios
    - moran_kagiroi_symbols_english_ios
    - moran_kagiroi_symbols_chinese_ios
    - moran_kagiroi_symbols_japanese_ios
    - moran_kagiroi_symbols_math_ios
    - moran_kagiroi_symbols_special_ios
    - moran_kagiroi_symbols_units_ios
    - moran_kagiroi_symbols_list_ios
    - moran_kagiroi_symbols_pinyin_ios
    - moran_kagiroi_symbols_bopomofo_ios
    - moran_kagiroi_symbols_radicals_ios
    - moran_kagiroi_symbols_greek_ios
    - moran_kagiroi_symbols_cyrillic_ios
    - moran_kagiroi_symbols_latin_ios
    - moran_kagiroi_symbols_korean_ios
    - moran_kagiroi_symbols_ipa_ios
    - moran_kagiroi_symbols_hiragana_ios
    - moran_kagiroi_symbols_katakana_ios
  horizontal: true
  proximity_correction: true
  reset_ascii_mode: false
  auto_caps: ascii

preset_keyboards:
  # 主层：保留数字行和完整 QWERTY，适合自然码与 Kagiroi 罗马字共用。
  moran_kagiroi_hybrid:
    name: "魔然·篝火日混"
    author: "Codex"
    ascii_mode: 0
    ascii_keyboard: moran_kagiroi_hybrid
    # 横屏使用独立的四行分区布局，避免把竖屏键等比拉宽。
    landscape_keyboard: moran_kagiroi_hybrid_landscape
    lock: true
    width: 10
    height: 50
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      # 数字行：S + 数字可继续触发方案中的数字输入；长按是常用符号。
      - {click: '1', long_click: '!'}
      - {click: '2', long_click: '@'}
      - {click: '3', long_click: '#'}
      - {click: '4', long_click: '$'}
      - {click: '5', long_click: '%'}
      - {click: '6', long_click: '^'}
      - {click: '7', long_click: '&'}
      - {click: '8', long_click: '*'}
      - {click: '9', long_click: '('}
      - {click: '0', long_click: ')'}

      # 罗马字主行。长按保留编程/英文常用符号。
      - {click: q, long_click: '_'}
      - {click: w, long_click: '-'}
      - {click: e, long_click: '+'}
      - {click: r, long_click: '='}
      - {click: t, long_click: '|'}
      - {click: y, long_click: '\\'}
      - {click: u, long_click: '['}
      - {click: i, long_click: ']'}
      - {click: o, long_click: '{'}
      - {click: p, long_click: '}'}

      # 「日」的实际输出是分号；分号是本方案进入 Kagiroi 日文段的前缀。
      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {click: ';', label: "日", hint: ";", long_click: ':'}

      # / 必须首层可用：它同时是方案 gikun 的分隔符与常用标点。
      - {click: z, long_click: '`'}
      - {click: x, long_click: cut}
      - {click: c, long_click: copy}
      - {click: v, long_click: paste}
      - {click: b, long_click: '~'}
      - {click: n, long_click: '"'}
      - {click: m, long_click: "'"}
      - {click: ',', long_click: '<'}
      - {click: '.', long_click: '>'}
      - {click: '/', label: '/', hint: "訓", long_click: '?'}

      # - 是 Kagiroi 罗马字字母表的一部分；长按可直接输入日文长音符。
      - {click: Shift_L, send_bindings: false, width: 12}
      # 短按数字、长按常用符号；用提示标明长按切层，避免双入口占位。
      - {click: Keyboard_moran_kagiroi_numbers, label: "123", long_click: Keyboard_moran_kagiroi_symbols, width: 12}
      - {click: Mode_switch, label: "中/英", long_click: Menu, width: 12}
      - {click: space, label: "魔然日混", preview: " ", width: 36}
      - {click: '-', label: "-", hint: "ー", long_click: "ー", width: 8}
      - {click: BackSpace, swipe_left: Escape, width: 10}
      - {click: Return, long_click: CommitComment, width: 10}

  # 横屏主层：按「左侧自然码 / 中间数字运算 / 右侧日文入口」三段组织。
  # 每个字母行恰好 14 键；中间的数字区便于横握时以拇指直接输入。
  moran_kagiroi_hybrid_landscape:
    name: "横屏·魔然日混"
    author: "Codex"
    ascii_mode: 0
    ascii_keyboard: moran_kagiroi_hybrid_landscape
    lock: true
    columns: 14
    width: 7.142857
    height: 48
    keyboard_height_land: 240
    # 覆盖 Trime 全局「自动分割键盘比例」；1% 仅保留极细分界，避免中间大面积留白。
    landscape_split_percent: 1
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      # 左 5 键自然码区 ｜ 中 4 键数字/运算区 ｜ 右 5 键罗马字区。
      - {click: q, long_click: '_'}
      - {click: w, long_click: '-'}
      - {click: e, long_click: '+'}
      - {click: r, long_click: '='}
      - {click: t, long_click: '|'}
      - {click: '7', long_click: '&'}
      - {click: '8', long_click: '*'}
      - {click: '9', long_click: '('}
      - {click: '-', label: '-', hint: "ー", long_click: "ー"}
      - {click: y, long_click: '\\'}
      - {click: u, long_click: '['}
      - {click: i, long_click: ']'}
      - {click: o, long_click: '{'}
      - {click: p, long_click: '}'}

      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: '4', long_click: '$'}
      - {click: '5', long_click: '%'}
      - {click: '6', long_click: '^'}
      - {click: '+', long_click: '='}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {click: ';', label: "日", hint: ";", long_click: ':'}

      # 长按左段可调用编辑动作；斜杠保持首层，便于 Kagiroi 的訓读输入。
      - {click: z, hint: "清", long_click: Escape}
      - {click: x, hint: "剪", long_click: cut}
      - {click: c, hint: "复", long_click: copy}
      - {click: v, hint: "粘", long_click: paste}
      - {click: b, hint: "符", long_click: Keyboard_moran_kagiroi_symbols}
      - {click: '1', long_click: '!'}
      - {click: '2', long_click: '@'}
      - {click: '3', long_click: '#'}
      - {click: '*', long_click: '×'}
      - {click: n, long_click: '"'}
      - {click: m, long_click: "'"}
      - {click: ',', long_click: '<'}
      - {click: '.', long_click: '>'}
      - {click: '/', label: '/', hint: "訓", long_click: '?'}

      # 双空格留给左右拇指；中段保留 = 0 ÷，与上方数字区形成小键盘。
      - {click: Mode_switch, label: "中/英", long_click: Menu, width: 8}
      - {click: Keyboard_moran_kagiroi_numbers, label: "123", long_click: Keyboard_moran_kagiroi_symbols, width: 8}
      - {click: Shift_L, send_bindings: false, width: 8}
      - {click: "'", long_click: '"', width: 7}
      - {click: space, label: "空格", preview: " ", width: 16}
      - {click: '=', width: 7}
      - {click: '0', long_click: ')', width: 7}
      - {click: '÷', long_click: '/', width: 7}
      - {click: space, label: "空格", preview: " ", width: 16}
      - {click: BackSpace, swipe_left: Escape, width: 9}
      - {click: Return, label: "搜寻", long_click: CommitComment, width: 7}

  moran_kagiroi_numbers:
    name: "数字"
    author: "Codex"
    ascii_mode: 1
    lock: true
    width: 10
    height: 50
    keyboard_height_land: 240
    landscape_split_percent: 1
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      - {click: "1"}
      - {click: "2"}
      - {click: "3"}
      - {click: "4"}
      - {click: "5"}
      - {click: "6"}
      - {click: "7"}
      - {click: "8"}
      - {click: "9"}
      - {click: "0"}
      - {click: "+"}
      - {click: "-"}
      - {click: "×"}
      - {click: "÷"}
      - {click: "="}
      - {click: "%"}
      - {click: "("}
      - {click: ")"}
      - {click: "["}
      - {click: "]"}
      - {click: "."}
      - {click: ","}
      - {click: ":"}
      - {click: ";"}
      - {click: "@"}
      - {click: "#"}
      - {click: "￥"}
      - {click: "$"}
      - {click: "_"}
      - {click: "／"}

      # 数字页仅保留一个返回键；长按直接进入常用符号，节省常驻入口。
      - {click: Keyboard_moran_kagiroi_hybrid, label: "ABC", long_click: Keyboard_moran_kagiroi_symbols, width: 16}
      - {click: Mode_switch, label: "中/英", long_click: Menu, width: 12}
      - {click: space, label: "空格", preview: " ", width: 36}
      - {click: ",", long_click: "<", width: 8}
      - {click: ".", long_click: ">", width: 8}
      - {click: BackSpace, swipe_left: Escape, width: 10}
      - {click: Return, long_click: CommitComment, width: 10}

  # iOS 式全量目录：长按「符」进入；每个类别页面均有短按回常用、长按回目录的入口。
  moran_kagiroi_symbol_catalog:
    name: "符号目录"
    author: "Codex"
    ascii_mode: 1
    lock: true
    columns: 30
    width: 16.6666
    height: 50
    keyboard_height_land: 240
    landscape_split_percent: 1
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      - {click: Keyboard_moran_kagiroi_symbols, label: "常用"}
      - {click: Keyboard_moran_kagiroi_symbols_english, label: "英文"}
      - {click: Keyboard_moran_kagiroi_symbols_chinese, label: "中文"}
      - {click: Keyboard_moran_kagiroi_symbols_japanese, label: "日文"}
      - {click: Keyboard_moran_kagiroi_symbols_math, label: "数学"}
      - {click: Keyboard_moran_kagiroi_symbols_special, label: "特殊"}
      - {click: Keyboard_moran_kagiroi_symbols_units, label: "单位"}
      - {click: Keyboard_moran_kagiroi_symbols_list, label: "列表"}
      - {click: Keyboard_moran_kagiroi_symbols_pinyin, label: "拼音"}
      - {click: Keyboard_moran_kagiroi_symbols_bopomofo, label: "注音"}
      - {click: Keyboard_moran_kagiroi_symbols_radicals, label: "部首"}
      - {click: Keyboard_moran_kagiroi_symbols_greek, label: "希腊"}
      - {click: Keyboard_moran_kagiroi_symbols_cyrillic, label: "俄文"}
      - {click: Keyboard_moran_kagiroi_symbols_latin, label: "拉丁"}
      - {click: Keyboard_moran_kagiroi_symbols_korean, label: "韩文"}
      - {click: Keyboard_moran_kagiroi_symbols_ipa, label: "音标"}
      - {click: Keyboard_moran_kagiroi_symbols_hiragana, label: "平假"}
      - {click: Keyboard_moran_kagiroi_symbols_katakana, label: "片假"}

      - {click: Keyboard_moran_kagiroi_hybrid, label: "ABC", hint: "123", long_click: Keyboard_moran_kagiroi_numbers, width: 12}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "常用", width: 12}
      - {click: Mode_switch, label: "中/英", long_click: Menu, width: 10}
      - {click: space, label: "空格", preview: " ", width: 32}
      - {click: ",", long_click: "<", width: 8}
      - {click: ".", long_click: ">", width: 8}
      - {click: BackSpace, swipe_left: Escape, width: 10}
      - {click: Return, long_click: CommitComment, width: 8}

  moran_kagiroi_symbols:
    name: "常用符号"
    author: "Codex"
    ascii_mode: 1
    lock: true
    width: 10
    height: 50
    keyboard_height_land: 240
    # 覆盖同文的横屏分割偏好，使符号网格铺满整个键盘宽度。
    landscape_split_percent: 1
