# Rime schema
# encoding: utf-8
# ===================================================================
# [INPUT]: 依赖同文输入法（Trime）的主题与虚拟键盘解析器、液态符号数据层，
#          以及 moran_kagiroi_hybrid.schema.yaml 的分号 Kagiroi 前缀规则。
# [OUTPUT]: 提供同几何的中英文主键盘、常驻数字行与可滚动的液态全量符号目录；
#           「日」键实际输入分号，直接开启 Kagiroi 罗马字日文段。
# [POS]:   Rime 用户目录根部的独立 Trime 主题与键盘布局，消费 moran_kagiroi_symbols.trime.yaml。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ===================================================================

config_version: "1.2"
name: "魔然·篝火日混"
author: "Codex"

# 保留同文内置的功能键与配色，避免覆盖用户已安装主题的基础能力。
android_keys:
  __include: trime:/android_keys
preset_keys:
  __include: trime:/preset_keys
  Keyboard_moran_kagiroi_symbols:
    label: "符"
    select: moran_kagiroi_symbols
  Keyboard_moran_kagiroi_hybrid_ascii:
    label: "中/英"
    send: Eisu_toggle
    select: moran_kagiroi_hybrid_ascii
  Keyboard_moran_kagiroi_hybrid:
    label: "中/英"
    send: Eisu_toggle
    select: moran_kagiroi_hybrid
fallback_colors:
  __include: trime:/fallback_colors
preset_color_schemes:
  __include: trime:/preset_color_schemes
style:
  # 所有会从本布局切换到的键盘必须在此声明。
  keyboards:
    - .default
    - moran_kagiroi_hybrid
    - moran_kagiroi_hybrid_landscape
    - moran_kagiroi_hybrid_ascii
    - moran_kagiroi_hybrid_ascii_landscape
    - moran_kagiroi_symbols
  horizontal: true
  proximity_correction: true
  reset_ascii_mode: false
  auto_caps: ascii

preset_keyboards:
  # 主层：保留数字行和完整 QWERTY，适合自然码与 Kagiroi 罗马字共用。
  moran_kagiroi_hybrid:
    name: "魔然·篝火日混"
    author: "Codex"
    ascii_mode: 0
    ascii_keyboard: moran_kagiroi_hybrid_ascii
    # 横屏使用独立的四行分区布局，避免把竖屏键等比拉宽。
    landscape_keyboard: moran_kagiroi_hybrid_landscape
    lock: true
    width: 10
    height: 50
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      # 数字行：S + 数字可继续触发方案中的数字输入；长按是常用符号。
      - {click: '1', long_click: '!'}
      - {click: '2', long_click: '@'}
      - {click: '3', long_click: '#'}
      - {click: '4', long_click: '$'}
      - {click: '5', long_click: '%'}
      - {click: '6', long_click: '^'}
      - {click: '7', long_click: '&'}
      - {click: '8', long_click: '*'}
      - {click: '9', long_click: '('}
      - {click: '0', long_click: ')'}

      # 罗马字主行。长按保留编程/英文常用符号。
      - {click: q, long_click: '_'}
      - {click: w, long_click: '-'}
      - {click: e, long_click: '+'}
      - {click: r, long_click: '='}
      - {click: t, long_click: '|'}
      - {click: y, long_click: '\\'}
      - {click: u, long_click: '['}
      - {click: i, long_click: ']'}
      - {click: o, long_click: '{'}
      - {click: p, long_click: '}'}

      # 「日」的实际输出是分号；分号是本方案进入 Kagiroi 日文段的前缀。
      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {click: ';', label: ";", hint: "日", long_click: ':'}

      # / 必须首层可用：它同时是方案 gikun 的分隔符与常用标点。
      - {click: z, long_click: '`'}
      - {click: x, long_click: cut}
      - {click: c, long_click: copy}
      - {click: v, long_click: paste}
      - {click: b, long_click: '~'}
      - {click: n, long_click: '"'}
      - {click: m, long_click: "'"}
      - {click: ',', long_click: '<'}
      - {click: '.', long_click: '>'}
      - {click: '/', label: '/', hint: "訓", long_click: '?'}

      # 数字行常驻；符号键打开液态分类目录，中英键保持原位置。
      - {click: Shift_L, send_bindings: false, width: 10}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "目录", width: 12}
      - {click: Keyboard_moran_kagiroi_hybrid_ascii, label: "中/英", width: 12}
      - {click: space, label: "魔然日混", preview: " ", width: 34}
      - {click: BackSpace, swipe_left: Escape, width: 20}
      - {click: Return, long_click: CommitComment, width: 12}

  # 英文层复制主层的几何结构；仅移除长按动作与提示，避免改变肌肉记忆。
  moran_kagiroi_hybrid_ascii:
    name: "英文·魔然日混"
    author: "Codex"
    ascii_mode: 1
    ascii_keyboard: moran_kagiroi_hybrid_ascii
    landscape_keyboard: moran_kagiroi_hybrid_ascii_landscape
    lock: true
    width: 10
    height: 50
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      - {click: '1'}
      - {click: '2'}
      - {click: '3'}
      - {click: '4'}
      - {click: '5'}
      - {click: '6'}
      - {click: '7'}
      - {click: '8'}
      - {click: '9'}
      - {click: '0'}

      - {click: q}
      - {click: w}
      - {click: e}
      - {click: r}
      - {click: t}
      - {click: y}
      - {click: u}
      - {click: i}
      - {click: o}
      - {click: p}

      - {click: a}
      - {click: s}
      - {click: d}
      - {click: f}
      - {click: g}
      - {click: h}
      - {click: j}
      - {click: k}
      - {click: l}
      - {click: ';', label: ";", hint: "日"}

      - {click: z}
      - {click: x}
      - {click: c}
      - {click: v}
      - {click: b}
      - {click: n}
      - {click: m}
      - {click: ','}
      - {click: '.'}
      - {click: '/', label: "/"}

      - {click: Shift_L, send_bindings: false, width: 10}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "目录", width: 12}
      - {click: Keyboard_moran_kagiroi_hybrid, label: "中/英", width: 12}
      - {click: space, label: "English", preview: " ", width: 34}
      - {click: BackSpace, swipe_left: Escape, width: 20}
      - {click: Return, width: 12}

  # 横屏英文层保持主层的三段键位结构，仅移除长按动作与提示。
  moran_kagiroi_hybrid_ascii_landscape:
    name: "横屏·英文日混"
    author: "Codex"
    ascii_mode: 1
    ascii_keyboard: moran_kagiroi_hybrid_ascii
    lock: true
    columns: 14
    width: 7.142857
    height: 48
    keyboard_height_land: 240
    landscape_split_percent: 1
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      - {click: q}
      - {click: w}
      - {click: e}
      - {click: r}
      - {click: t}
      - {click: '7'}
      - {click: '8'}
      - {click: '9'}
      - {click: '-', label: "-"}
      - {click: y}
      - {click: u}
      - {click: i}
      - {click: o}
      - {click: p}

      - {click: a}
      - {click: s}
      - {click: d}
      - {click: f}
      - {click: g}
      - {click: '4'}
      - {click: '5'}
      - {click: '6'}
      - {click: '+'}
      - {click: h}
      - {click: j}
      - {click: k}
      - {click: l}
      - {click: ';', label: ";", hint: "日"}

      - {click: z}
      - {click: x}
      - {click: c}
      - {click: v}
      - {click: b}
      - {click: '1'}
      - {click: '2'}
      - {click: '3'}
      - {click: '*'}
      - {click: n}
      - {click: m}
      - {click: ','}
      - {click: '.'}
      - {click: '/', label: "/"}

      - {click: Shift_L, send_bindings: false, width: 8}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "目录", width: 8}
      - {click: Keyboard_moran_kagiroi_hybrid, label: "中/英", width: 8}
      - {click: space, label: "English", preview: " ", width: 16}
      - {click: '=', width: 7}
      - {click: '0', width: 7}
      - {click: '÷', width: 7}
      - {click: space, label: "English", preview: " ", width: 16}
      - {click: BackSpace, swipe_left: Escape, width: 12}
      - {click: Return, label: "搜寻", width: 11}

  # 横屏主层：按「左侧自然码 / 中间数字运算 / 右侧日文入口」三段组织。
  # 每个字母行恰好 14 键；中间的数字区便于横握时以拇指直接输入。
  moran_kagiroi_hybrid_landscape:
    name: "横屏·魔然日混"
    author: "Codex"
    ascii_mode: 0
    ascii_keyboard: moran_kagiroi_hybrid_ascii
    lock: true
    columns: 14
    width: 7.142857
    height: 48
    keyboard_height_land: 240
    # 覆盖 Trime 全局「自动分割键盘比例」；1% 仅保留极细分界，避免中间大面积留白。
    landscape_split_percent: 1
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      # 左 5 键自然码区 ｜ 中 4 键数字/运算区 ｜ 右 5 键罗马字区。
      - {click: q, long_click: '_'}
      - {click: w, long_click: '-'}
      - {click: e, long_click: '+'}
      - {click: r, long_click: '='}
      - {click: t, long_click: '|'}
      - {click: '7', long_click: '&'}
      - {click: '8', long_click: '*'}
      - {click: '9', long_click: '('}
      - {click: '-', label: '-', hint: "ー", long_click: "ー"}
      - {click: y, long_click: '\\'}
      - {click: u, long_click: '['}
      - {click: i, long_click: ']'}
      - {click: o, long_click: '{'}
      - {click: p, long_click: '}'}

      - {click: a, long_click: select_all}
      - {click: s, long_click: Home}
      - {click: d, long_click: End}
      - {click: f, long_click: Page_Up}
      - {click: g, long_click: Page_Down}
      - {click: '4', long_click: '$'}
      - {click: '5', long_click: '%'}
      - {click: '6', long_click: '^'}
      - {click: '+', long_click: '='}
      - {click: h, long_click: Left}
      - {click: j, long_click: Down}
      - {click: k, long_click: Up}
      - {click: l, long_click: Right}
      - {click: ';', label: ";", hint: "日", long_click: ':'}

      # 长按左段可调用编辑动作；斜杠保持首层，便于 Kagiroi 的訓读输入。
      - {click: z, hint: "清", long_click: Escape}
      - {click: x, hint: "剪", long_click: cut}
      - {click: c, hint: "复", long_click: copy}
      - {click: v, hint: "粘", long_click: paste}
      - {click: b, long_click: '~'}
      - {click: '1', long_click: '!'}
      - {click: '2', long_click: '@'}
      - {click: '3', long_click: '#'}
      - {click: '*', long_click: '×'}
      - {click: n, long_click: '"'}
      - {click: m, long_click: "'"}
      - {click: ',', long_click: '<'}
      - {click: '.', long_click: '>'}
      - {click: '/', label: '/', hint: "訓", long_click: '?'}

      # 双空格留给左右拇指；数字常驻于中段，符号目录与中英状态均短按切换。
      - {click: Shift_L, send_bindings: false, width: 8}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "目录", width: 8}
      - {click: Keyboard_moran_kagiroi_hybrid_ascii, label: "中/英", width: 8}
      - {click: space, label: "空格", preview: " ", width: 16}
      - {click: '=', width: 7}
      - {click: '0', long_click: ')', width: 7}
      - {click: '÷', long_click: '/', width: 7}
      - {click: space, label: "空格", preview: " ", width: 16}
      - {click: BackSpace, swipe_left: Escape, width: 12}
      - {click: Return, label: "搜寻", long_click: CommitComment, width: 11}

  moran_kagiroi_numbers:
    name: "数字"
    author: "Codex"
    ascii_mode: 1
    lock: false
    width: 10
    height: 50
    keyboard_height_land: 240
    landscape_split_percent: 1
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      - {click: "1"}
      - {click: "2"}
      - {click: "3"}
      - {click: "4"}
      - {click: "5"}
      - {click: "6"}
      - {click: "7"}
      - {click: "8"}
      - {click: "9"}
      - {click: "0"}
      - {click: "+"}
      - {click: "-"}
      - {click: "×"}
      - {click: "÷"}
      - {click: "="}
      - {click: "%"}
      - {click: "("}
      - {click: ")"}
      - {click: "["}
      - {click: "]"}
      - {click: "."}
      - {click: ","}
      - {click: ":"}
      - {click: ";"}
      - {click: "@"}
      - {click: "#"}
      - {click: "￥"}
      - {click: "$"}
      - {click: "_"}
      - {click: "／"}

      # 数字页复用同一液态符号目录，避免维护第二套符号键盘。
      - {click: Keyboard_moran_kagiroi_hybrid, label: "中", width: 12}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "目录", width: 10}
      - {click: Keyboard_moran_kagiroi_hybrid_ascii, label: "英", width: 10}
      - {click: space, label: "空格", preview: " ", width: 32}
      - {click: ",", long_click: "<", width: 7}
      - {click: ".", long_click: ">", width: 7}
      - {click: BackSpace, swipe_left: Escape, width: 12}
      - {click: Return, long_click: CommitComment, width: 10}
