      - {click: Keyboard_moran_kagiroi_hybrid, label: "ABC", hint: "123", long_click: Keyboard_moran_kagiroi_numbers, width: 12}
      - {click: Keyboard_moran_kagiroi_symbols, label: "符", hint: "目录", long_click: Keyboard_moran_kagiroi_symbol_catalog, width: 12}
