# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ===================================================================

symbol_palette_meta:
  source: https://github.com/rime/rime-prelude/blob/master/symbols.yaml
  source_version: "1.6"
  source_groups: 201
  source_entries: 4604
  source_unique_entries: 3860
  covered_source_groups: 201

