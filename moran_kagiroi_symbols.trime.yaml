# Rime schema
# encoding: utf-8
# ===================================================================
# [INPUT]: 依赖 Trime 内置预设符号键盘与高频全量标点。
# [OUTPUT]: 对外提供与 moran_ja_hybrid 完全一致的 5 行标准符号键盘（含上标与底部快捷栏）。
# [POS]:   Trime 符号键盘定义，被 moran_kagiroi_hybrid.trime.yaml 与 trime.custom.yaml 引用。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ===================================================================

preset_keyboards:
  moran_kagiroi_symbols:
    name: "符號"
    author: "Senn"
    ascii_mode: 0
    width: 10
    height: 44
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      # --- Row 1: 数字行 ---
      - {click: '1'}
      - {click: '2'}
      - {click: '3'}
      - {click: '4'}
      - {click: '5'}
      - {click: '6'}
      - {click: '7'}
      - {click: '8'}
      - {click: '9'}
      - {click: '0'}

      # --- Row 2: 常用 ASCII 符号行 ---
      - {click: '~', hint: '`', long_click: '`'}
      - {click: '!'}
      - {click: '@'}
      - {click: '#'}
      - {click: '$'}
      - {click: '¥'}
      - {click: '%'}
      - {click: '^'}
      - {click: '&'}
      - {click: '*'}

      # --- Row 3: 括号、引号、斜杠类符号行 ---
      - {click: '(', hint: '{', long_click: '{'}
      - {click: ')', hint: '}', long_click: '}'}
      - {click: '[', hint: '【', long_click: '【'}
      - {click: ']', hint: '】', long_click: '】'}
      - {click: '「', hint: '『', long_click: '『'}
      - {click: '」', hint: '』', long_click: '』'}
      - {click: '\\', hint: '|', long_click: '|'}
      - {click: '/', hint: '√', long_click: '√'}
      - {click: ':'}
      - {click: ';'}

      # --- Row 4: 运算符、尖括号、引号、标点与退格 ---
      - {click: '+'}
      - {click: '-', hint: '_', long_click: '_'}
      - {click: '='}
      - {click: '<', hint: '«', long_click: '«'}
      - {click: '>', hint: '»', long_click: '»'}
      - {click: '"'}
      - {click: "'"}
      - {click: ',', hint: '，', long_click: '，'}
      - {click: '?', hint: '？', long_click: '？'}
      - {click: BackSpace, label: "退格", hint: "Esc", swipe_left: Escape}

      # --- Row 5: 底部功能行 ---
      - {click: Keyboard_moran_kagiroi_hybrid, label: "返回", hint: "方案", width: 14}
      - {click: Keyboard_number, label: "数字", hint: "配色", width: 14}
      - {click: Keyboard_symbols, label: "迷你", hint: "主题", width: 14}
      - {click: space, label: "魔然·日混", preview: " ", width: 28}
      - {click: '.', label: ".", width: 10}
      - {click: Keyboard_symbols, label: "更多", hint: "删除", width: 10}
      - {click: Return, label: "Enter", hint: "全选", long_click: select_all, width: 10}
