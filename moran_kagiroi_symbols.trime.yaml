# Rime schema
# encoding: utf-8
# ===================================================================
# [INPUT]: 依赖 Rime 官方 symbols.yaml 预设的常用高频标点与符号。
# [OUTPUT]: 对外提供极其稳定、Pop-up 瞬间弹出、严格 10 列成对对齐且带底部操作栏的静态符号键盘。
# [POS]:   Trime 符号键盘定义，被 moran_kagiroi_hybrid.trime.yaml 与 trime.custom.yaml 引用。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ===================================================================

preset_keyboards:
  moran_kagiroi_symbols:
    name: "符号键盘"
    author: "Senn"
    ascii_mode: 0
    width: 10
    height: 44
    horizontal_gap: 1
    vertical_gap: 1
    label_transform: none
    keys:
      # --- Row 1: 基础高频标点与分隔符 ---
      - {click: '，'}
      - {click: '。'}
      - {click: '！'}
      - {click: '？'}
      - {click: '；'}
      - {click: '：'}
      - {click: '、'}
      - {click: '·'}
      - {click: '…'}
      - {click: '—'}

      # --- Row 2: 常用成对括号与引号 ---
      - {click: '“'}
      - {click: '”'}
      - {click: '‘'}
      - {click: '’'}
      - {click: '（'}
      - {click: '）'}
      - {click: '【'}
      - {click: '】'}
      - {click: '《'}
      - {click: '》'}

      # --- Row 3: 补充成对括号与书名号 ---
      - {click: '「'}
      - {click: '」'}
      - {click: '『'}
      - {click: '』'}
      - {click: '［'}
      - {click: '］'}
      - {click: '｛'}
      - {click: '｝'}
      - {click: '〈'}
      - {click: '〉'}

      # --- Row 4: 常用编程/英文符号与运算 ---
      - {click: '￥'}
      - {click: '$'}
      - {click: '@'}
      - {click: '#'}
      - {click: '%'}
      - {click: '&'}
      - {click: '*'}
      - {click: '+'}
      - {click: '-'}
      - {click: '='}

      # --- Row 5: 运算、方向与打勾 ---
      - {click: '÷'}
      - {click: '×'}
      - {click: '√'}
      - {click: '°'}
      - {click: '℃'}
      - {click: '→'}
      - {click: '←'}
      - {click: '↑'}
      - {click: '↓'}
      - {click: '✓'}

      # --- Row 6: 常用序号与日文标点 ---
      - {click: '①'}
      - {click: '②'}
      - {click: '③'}
      - {click: '④'}
      - {click: '⑤'}
      - {click: 'ー'}
      - {click: '〜'}
      - {click: '々'}
      - {click: '〆'}
      - {click: '〒'}

      # --- Row 7: 常驻底部操作栏 ---
      - {click: Keyboard_moran_kagiroi_hybrid, label: "返回", width: 25}
      - {click: space, label: "空格", width: 50}
      - {click: BackSpace, label: "⌫", width: 25}
